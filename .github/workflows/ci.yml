name: ci
# ProofGate gates itself: every guard is proven on BOTH paths (fires on the sin,
# stays quiet on the clean diff), the full engine is exercised end to end, and the
# hooks are fed synthetic events — all before anything lands on main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        # macOS buys us bash 3.2 + BSD grep coverage — the portability floor we
        # promise. It is billing-free on public repos.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard + engine + hook unit tests
        run: bash tests/run-tests.sh
      - name: End-to-end acceptance (the whole protocol in a real repo)
        run: bash tests/acceptance.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Shell hygiene (blocking)
        run: |
          # Globs, not a hand-maintained list: a script someone forgets to append
          # here is a script that silently escapes linting — the exact class of
          # quiet gap this repo exists to catch.
          shellcheck -S warning \
            skills/proofgate/scripts/*.sh \
            skills/proofgate/scripts/guards.d/*.sh \
            hooks/*.sh \
            install.sh \
            tests/run-tests.sh

  self-gate:
    # ProofGate runs its own gate on its own diff. If the tool cannot pass the
    # standard it sells, the standard is theater.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Universal Ctags (exercises the high-confidence navigation backend)
        run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags
      - name: Gate this delivery
        run: bash skills/proofgate/scripts/verify.sh --base origin/main
