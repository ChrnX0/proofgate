name: publish-proof-notes

# Publishes refs/notes/proofgate from the note bodies committed under
# .proofgate-notes/.
#
# WHY a workflow and not a `git push` from the author's machine:
#
# `proof.sh seal` writes the evidence to a git note locally, and `--push` sends it
# to the remote. That push is the step that fails in more places than it should: a
# note lives under refs/notes/*, and network relays, proxies and hosts that only
# forward refs/heads/* refuse it — not for lack of permission, but because the ref
# namespace is not in their allowlist. The evidence then stays on one laptop, which
# is the exact trust-me problem sealing exists to remove.
#
# A runner has contents:write and no such relay in front of it. So the note bodies
# travel as ordinary files on a branch — which every relay does forward — and the
# runner reassembles the ref on the other side.
on:
  push:
    branches: [claude/ideal-dev-tool-improvements-u83jsz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plumbing, deliberately, instead of `git notes add -F`: that path runs the
      # body through stripspace, and a single trailing byte changed means the
      # recomputed section hashes stop matching and `proof.sh verify` reports
      # `tampered`. `git mktree` writes exactly the bytes it is handed.
      - name: Rebuild the notes ref
        # commit-tree refuses to run without an identity, and the runner has none.
        # A local test passes here for an environmental reason — the author's own
        # git config — which is exactly the kind of "worked on my machine" this
        # repository exists to stop trusting.
        env:
          GIT_AUTHOR_NAME: proofgate
          GIT_AUTHOR_EMAIL: proofgate@users.noreply.github.com
          GIT_COMMITTER_NAME: proofgate
          GIT_COMMITTER_EMAIL: proofgate@users.noreply.github.com
        run: |
          set -euo pipefail
          : > /tmp/notes-index
          for f in .proofgate-notes/*; do
            sha="$(basename "$f")"
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "not a commit sha: $f"; exit 1; }
            git cat-file -e "$sha^{commit}" || { echo "no such commit: $sha"; exit 1; }
            blob="$(git hash-object -w "$f")"
            printf '100644 blob %s\t%s\n' "$blob" "$sha" >> /tmp/notes-index
          done
          tree="$(git mktree < /tmp/notes-index)"
          commit="$(git commit-tree "$tree" -m 'ProofGate: sealed evidence')"
          git update-ref refs/notes/proofgate "$commit"
          git ls-tree -r refs/notes/proofgate

      # Verify BEFORE publishing. Pushing evidence that does not verify would be
      # worse than pushing none: it looks like proof and is not.
      - name: Verify every note
        run: |
          set -euo pipefail
          for f in .proofgate-notes/*; do
            bash skills/proofgate/scripts/proof.sh verify "$(basename "$f")" --summary | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish
        run: git push origin refs/notes/proofgate

      - name: Confirm it landed
        run: git ls-remote origin 'refs/notes/*'
